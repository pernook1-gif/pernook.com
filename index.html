<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pernook Coworking & Art Space</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f8f8f8;
    color:#333;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.logo{
    width:220px;
    margin-bottom:25px;
}

h1{
    font-size:3rem;
    margin-bottom:15px;
}

.subtitle{
    font-size:1.3rem;
    color:#666;
    margin-bottom:25px;
}

.info{
    font-size:1.1rem;
    line-height:2;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.instagram{
    background:#E1306C;
    color:white;
}

.btn:hover{
    transform:translateY(-3px);
}

.counter{
    margin-top:50px;
    background:white;
    padding:20px 40px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.counter h3{
    margin-bottom:10px;
}

.visitors{
    font-size:2rem;
    font-weight:bold;
}

.coming{
    margin-top:30px;
    color:#777;
}

</style>
</head>

<body>

<section class="hero">

<img src="Capture.PNG" class="logo">

<h1>Pernook</h1>

<p class="subtitle">Coworking & Art Space</p>

<div class="info">
📍 Zahraa El Maadi<br>
🕒 10 AM – 10 PM<br>
🎨 Work • Study • Meetings • Events
</div>

<div class="buttons">
<a class="btn whatsapp" href="#">WhatsApp</a>
<a class="btn instagram" href="#">Instagram</a>
</div>

<div class="counter">
<h3>Website Visitors</h3>
<div class="visitors" id="count">1</div>
</div>

<div class="coming">
Website Under Development
</div>

</section>

<script>

// Simple local visitor counter
let count = localStorage.getItem('pernookVisitors');

if(!count){
    count = 1;
}else{
    count = parseInt(count) + 1;
}

localStorage.setItem('pernookVisitors',count);

document.getElementById('count').innerText = count;

</script>

</body>
</html>
